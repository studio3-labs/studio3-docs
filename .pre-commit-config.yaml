repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Format Markdown with Prettier
        files: \.md$
        exclude: ^(CLAUDE\.md|README\.md)$
        
  - repo: local
    hooks:
      # Changed files only, matching the PR Checks workflow: the repository
      # still carries pre-existing lint errors, and gating every commit on
      # them would just get the hook disabled.
      - id: markdown-lint
        name: Markdown Lint (staged files)
        entry: python3 lint_markdown_ultra.py
        language: system
        files: ^docs/.*\.md$

      - id: markdown-dead-token-guard
        name: Dead-token guard ($SIGNAL / $STUDIO)
        entry: python3 lint_markdown_ultra.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        args: [--token-guard, docs]
        
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]