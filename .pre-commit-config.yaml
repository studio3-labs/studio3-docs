# There is deliberately no Prettier hook here.
#
# Prettier does not understand MkDocs admonitions: it strips the four-space
# indentation from an admonition body and reflows it onto the "!!!" line, so a
# single `prettier --write` over docs/ silently collapses the Flare Playbook in
# docs/overview-guide/seven-phases.md - and every other phase admonition - into
# a line that no longer renders as a list. A commit hook is the worst possible
# place for that, because it rewrites the files after the author has read them.
#
# docs/ is in .prettierignore as well, so an ad-hoc `npx prettier --write` is
# safe too. lint_markdown_ultra.py is the format and lint gate. See LINTING.md.
repos:
  - repo: local
    hooks:
      # Changed files only, matching the PR Checks workflow: the repository
      # still carries pre-existing lint errors, and gating every commit on
      # them would just get the hook disabled.
      - id: markdown-lint
        name: Markdown Lint (staged files)
        entry: python3 lint_markdown_ultra.py
        language: system
        files: ^docs/.*\.md$

      - id: markdown-dead-token-guard
        name: Dead-token guard ($SIGNAL / $STUDIO)
        entry: python3 lint_markdown_ultra.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        args: [--token-guard, docs]
        
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]